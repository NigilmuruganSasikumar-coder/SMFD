<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Real-time · Selvamurugan Fast Drills Admin</title>
<link rel="icon" href="img/favicon.ico" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin">

  <div class="admin-layout">
    <div id="sidebarMount"></div>

    <div class="admin-main">
      <div id="topbarMount"></div>

      <main class="admin-content">
        <div id="pageError" class="error-banner" hidden></div>

        <div class="page-head">
          <div>
            <h1>Real-time Visitors</h1>
            <p>Live activity on your website</p>
          </div>
          <div class="page-head-actions">
            <span class="live-pill"><span class="live-dot"></span> Live</span>
            <span class="stat-note">Last updated <strong id="lastUpdated">—</strong></span>
          </div>
        </div>

        <section class="stat-grid">
          <div class="stat-card">
            <div class="stat-icon stat-icon--green"><i class="fas fa-signal"></i></div>
            <div class="stat-label">Online Now</div>
            <div class="stat-value" id="statOnlineNow">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--blue"><i class="fas fa-bolt"></i></div>
            <div class="stat-label">In Last 5 Minutes</div>
            <div class="stat-value" id="statLast5">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--purple"><i class="fas fa-stopwatch"></i></div>
            <div class="stat-label">In Last 30 Minutes</div>
            <div class="stat-value" id="statLast30">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon--amber"><i class="fas fa-calendar-day"></i></div>
            <div class="stat-label">Today's Visitors</div>
            <div class="stat-value" id="statToday">—</div>
          </div>
        </section>

        <section class="grid-2">
          <div class="panel">
            <div class="panel-title" style="margin-bottom:14px;">Live Visitor Map</div>
            <div class="live-map" id="liveMap"></div>
          </div>
          <div class="panel">
            <div class="panel-title" style="margin-bottom:14px;">Recent Visitors</div>
            <div style="overflow-x:auto;max-height:340px;overflow-y:auto;">
              <table class="data-table">
                <thead><tr><th>Time</th><th>Location</th><th>Page</th></tr></thead>
                <tbody id="recentVisitorsBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title" style="margin-bottom:14px;">Live Activity Stream</div>
          <ul class="data-table" id="liveStreamList" style="list-style:none;padding:0;margin:0;"></ul>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/realtime.js"></script>
</body>
</html>
